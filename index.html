<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta name="theme-color" content="#03071f">
        <title>Shogi Space</title>
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23091432'/%3E%3Cg fill='none' stroke='%237ddaff' stroke-width='3'%3E%3Cellipse cx='32' cy='32' rx='23' ry='10' transform='rotate(-35 32 32)'/%3E%3Cellipse cx='32' cy='32' rx='23' ry='10' transform='rotate(35 32 32)'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='5' fill='%23c0efff'/%3E%3C/svg%3E">
        <style>
            @font-face {
                font-family: 'Mark GEO CAPS';
                src: local('Mark GEO CAPS'),local('Mark GEO CAPS Regular'),local('MarkGEOCAPS');
                font-weight: 100 900;
                font-style: normal;
                font-display: swap
            }

            :root {
                --ink: #edf6ff;
                --muted: #a5bed8;
                --font: 'Mark GEO CAPS','Segoe UI','Noto Sans Georgian',sans-serif;
                --number: 'Segoe UI',Arial,sans-serif;
                --ticker-height: 70px;
                --background-color: #03071f;
                --wave-opacity: .91;
                --wave-contrast: 1.12;
                --wave-brightness: 1.05;
                --line: #7491b526;
                --accent: #3269bb
            }

            * {
                box-sizing: border-box
            }

            body {
                margin: 0;
                overflow: hidden;
                isolation: isolate;
                background: var(--background-color);
                font: 14px var(--font);
                color: var(--ink)
            }

            button,input,select {
                font: inherit;
                color: inherit
            }

            button,a,input,select {
                -webkit-tap-highlight-color: transparent
            }

            button {
                cursor: pointer;
                border: 0;
                background: none
            }

            a {
                color: inherit;
                text-decoration: none
            }

            h1,h2,h3,p {
                margin: 0
            }

            h1,h2,h3 {
                font-weight: 600
            }

            h2 {
                font-size: 18px
            }

            button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible {
                outline: 2px solid #5f99ef;
                outline-offset: 4px
            }

            button:disabled {
                cursor: wait;
                opacity: .6
            }

            [hidden] {
                display: none!important
            }

            svg {
                width: 21px;
                height: 21px;
                display: block;
                fill: none;
                stroke: currentColor;
                stroke-width: 1.5;
                stroke-linecap: round;
                stroke-linejoin: round;
                flex: none
            }

            button svg {
                pointer-events: none
            }

            .background {
                position: fixed;
                inset: 0;
                z-index: -1;
                pointer-events: none;
                background: var(--background-color);
                overflow: hidden
            }

            #waveCanvas {
                display: block;
                width: 100%;
                height: 100%;
                opacity: var(--wave-opacity);
                filter: contrast(var(--wave-contrast)) brightness(var(--wave-brightness))
            }

            .brand {
                position: fixed;
                top: 4px;
                left: 4px;
                z-index: 6;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 0;
                font-family: var(--number);
                letter-spacing: -1px;
                color: var(--ink);
                user-select: none;
                -webkit-user-select: none;
                -webkit-user-drag: none
            }

            .brand>span {
                width: 35px;
                height: 35px;
                border-radius: 11px;
                background: #10284980;
                color: #8de4ff;
                display: grid;
                place-items: center;
                border: 1px solid #83cfff30;
                box-shadow: 0 0 18px #0fbaff12
            }

            .brand>span svg {
                width: 27px;
                height: 27px;
                stroke-width: 1.2
            }

            .brand b {
                font-size: 23px;
                font-weight: 650
            }

            .brand b>span {
                font-weight: 350
            }

            .brand.refreshing>span svg {
                animation: spin 1.4s linear infinite
            }

            .round-button {
                display: grid;
                place-items: center;
                width: 39px;
                height: 39px;
                border: 1px solid #badbff35;
                border-radius: 50%;
                background: #c0dcff12;
                backdrop-filter: blur(12px);
                color: #bddcff;
                flex: none
            }

            .round-button:hover {
                background: #d8edff28
            }

            .round-button svg {
                width: 18px;
                height: 18px
            }

            .all-reveal {
                position: fixed;
                right: 0;
                top: 0;
                width: 60px;
                height: 60px;
                display: grid;
                place-items: center;
                z-index: 7
            }

            .all-reveal>.round-button,.settings-reveal>.round-button {
                opacity: 0;
                pointer-events: none;
                transition: opacity .35s
            }

            .all-reveal.visible>.round-button,.all-reveal:hover>.round-button,.all-reveal>.round-button:focus-visible,.settings-reveal.visible>.round-button,.settings-reveal:hover>.round-button,.settings-reveal>.round-button:focus-visible {
                opacity: 1;
                pointer-events: auto
            }

            .settings-reveal {
                position: fixed;
                right: 0;
                bottom: calc(var(--ticker-height) + 4px);
                width: 60px;
                height: 63px;
                display: grid;
                place-items: center;
                z-index: 7
            }

            #main {
                position: fixed;
                inset: 0 0 var(--ticker-height)
            }

            .clocks {
                position: absolute;
                left: 8px;
                top: 50%;
                transform: translateY(-50%);
                width: max-content;
                max-width: calc(100vw - 16px);
                z-index: 2;
                pointer-events: none;
                border-radius: 24px;
                text-shadow: 0 2px 22px #0004
            }

            .clock-block {
                width: max-content;
                max-width: 100%
            }

            .clock-block+.clock-block {
                margin-top: 45px
            }

            .clock-row {
                display: flex;
                gap: 18px;
                align-items: center
            }

            .flag {
                display: block;
                flex: none;
                width: 45px;
                height: 31px;
                border-radius: 3px;
                overflow: hidden;
                box-shadow: 0 0 0 1px #d5ebff12
            }

            .flag svg {
                width: 45px;
                height: 31px;
                transform: scale(1.15)
            }

            .clock-row time {
                font-family: var(--number);
                font-weight: 300;
                letter-spacing: -8px;
                line-height: 1.02;
                font-variant-numeric: tabular-nums;
                display: block;
                color: var(--ink)
            }

            #berlinTime {
                font-size: clamp(118px,12.1vw,184px)
            }

            #tbilisiTime {
                font-size: clamp(93px,8.9vw,134px);
                color: var(--muted)
            }

            .clock-date {
                font-size: clamp(12px,1.1vw,17px);
                line-height: 1.6;
                text-align: right;
                color: var(--muted);
                margin: 12px 0 0 62px;
                letter-spacing: .01em;
                white-space: nowrap
            }

            .clock-impact {
                animation: clock-hit .65s ease-out
            }

            #siteBubbles {
                position: absolute;
                inset: 0;
                z-index: 3;
                pointer-events: none;
                overflow: hidden
            }

            .site-bubble {
                position: absolute;
                left: 0;
                top: 0;
                width: var(--bubble-size,150px);
                height: var(--bubble-size,150px);
                pointer-events: auto;
                border-radius: 50%;
                will-change: transform;
                touch-action: manipulation;
                outline-offset: 3px
            }

            .bubble-shell {
                position: absolute;
                inset: 0;
                border-radius: 50%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 12px;
                background: radial-gradient(ellipse at 26% 18%,#fffffff0 0%,#ffffff8a 23%,#ffffff10 61%),var(--bubble,#dce8be);
                border: 1px solid #ffffffd9;
                box-shadow: inset 0 1px 8px #ffffff80,inset -7px -10px 20px #567fa51c,0 15px 40px #020b2e4d,0 0 25px #71b7ff14;
                pointer-events: none;
                will-change: transform,border-radius
            }

            .bubble-shell:before {
                content: '';
                position: absolute;
                top: 11%;
                left: 20%;
                width: 33%;
                height: 12%;
                border-radius: 50%;
                background: #fff8;
                filter: blur(3px);
                rotate: -30deg
            }

            .site-bubble:hover .bubble-shell {
                filter: brightness(1.045)
            }

            .bubble-label {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                stroke: none;
                fill: #334f64;
                pointer-events: none
            }

            .bubble-label text {
                font: 500 15px var(--font);
                letter-spacing: .4px;
                fill: #334f64;
                stroke: none
            }

            .bubble-icon {
                margin-top: 23px;
                color: #45687a
            }

            .bubble-icon svg {
                width: 36px;
                height: 36px;
                stroke-width: 1.25
            }

            .lead .bubble-icon svg {
                width: 41px;
                height: 41px
            }

            .bubble-domain {
                font-family: var(--number);
                font-size: 8px;
                max-width: 78%;
                overflow: hidden;
                white-space: nowrap;
                text-overflow: ellipsis;
                color: #697f8c
            }

            .ticker {
                position: fixed;
                inset: auto 0 0;
                height: var(--ticker-height);
                z-index: 5;
                background: var(--ticker-background,#e3edf7);
                color: var(--ticker-foreground,#355473);
                border-top: 1px solid #ffffffa0;
                box-shadow: 0 -4px 24px #00000013;
                transition: background .5s,color .5s;
                overflow: hidden
            }

            .ticker-window {
                width: 100%;
                height: 100%;
                overflow: hidden;
                display: flex;
                align-items: center
            }

            #tickerTrack {
                position: relative;
                display: block;
                flex: none;
                width: max-content;
                will-change: transform
            }

            .ticker-item {
                display: flex;
                align-items: center;
                gap: 15px;
                white-space: nowrap;
                min-height: 48px;
                padding: 10px 5px;
                font-size: 20px;
                line-height: 1.5;
                color: inherit
            }

            .ticker-item strong {
                font-weight: 800
            }

            .ticker-item svg {
                width: 24px;
                height: 24px;
                stroke-width: 1.65
            }

            .ticker-item:hover {
                filter: brightness(.85)
            }

            .ticker-item:focus-visible {
                outline-offset: -2px;
                border-radius: 4px
            }

            dialog {
                --ink: #243f65;
                --muted: #8397b3;
                --line: #6c8baa26;
                padding: 0;
                border: 1px solid #e2efffce;
                background: #f4f7fcfa;
                color: var(--ink);
                border-radius: 22px;
                box-shadow: 0 30px 100px #0007;
                width: min(600px,calc(100vw - 32px));
                max-height: calc(100dvh - 38px);
                overflow: hidden;
                margin: auto
            }

            dialog[open] {
                display: flex;
                flex-direction: column;
                animation: dialog-in .22s ease-out
            }

            dialog::backdrop {
                background: #030b2554;
                backdrop-filter: blur(12px)
            }

            .full-dialog {
                inset: .5cm;
                width: calc(100vw - 1cm);
                height: calc(100dvh - 1cm);
                max-width: none;
                max-height: none;
                margin: 0
            }

            .dialog-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 20px;
                padding: 23px 28px;
                border-bottom: 1px solid var(--line);
                flex: none
            }

            .dialog-header h1,.dialog-header h2 {
                font-size: 23px
            }

            .full-dialog .dialog-header {
                padding: 24px 32px
            }

            .full-dialog .dialog-header h1,.full-dialog .dialog-header h2 {
                font-size: 26px
            }

            .dialog-header .round-button {
                width: 33px;
                height: 33px;
                border: 0;
                background: #e7eef8;
                color: #7893b6;
                backdrop-filter: none
            }

            .dialog-header .round-button:hover {
                background: #dce8f9
            }

            .dialog-body {
                padding: 25px 28px;
                overflow: auto;
                overscroll-behavior: contain
            }

            .tabs {
                display: flex;
                gap: 30px;
                padding: 0 32px;
                border-bottom: 1px solid var(--line);
                flex: none;
                overflow-x: auto
            }

            .tabs button {
                padding: 16px 0 13px;
                font-size: 13px;
                border-bottom: 2px solid transparent;
                color: #8397b3;
                white-space: nowrap
            }

            .tabs button[aria-selected=true] {
                color: #2e66b7;
                border-color: #6395dd
            }

            .settings-body {
                padding: 28px 32px;
                overflow: auto;
                flex: 1;
                min-height: 0;
                overscroll-behavior: contain
            }

            .settings-body>section {
                min-height: 100%;
                width: 100%;
                max-width: none
            }

            .site-management {
                display: grid;
                grid-template-columns: minmax(260px,.7fr) minmax(0,1.7fr);
                gap: 32px;
                align-items: start
            }

            .site-management form {
                padding: 25px;
                border: 1px solid #d7e3f2;
                background: #fff9;
                border-radius: 16px;
                position: sticky;
                top: 0
            }

            .site-management h2 {
                font-size: 17px;
                margin-bottom: 23px
            }

            .site-management form>.primary-button {
                margin-top: 24px
            }

            label {
                display: block;
                font-size: 12px;
                color: #7b93b2;
                margin-bottom: 8px
            }

            input:not([type=checkbox]):not([type=hidden]):not([type=color]):not([type=range]),select {
                font: inherit;
                font-size: 13px;
                border: 1px solid #d3dfee;
                background: #ffffffc0;
                border-radius: 9px;
                padding: 12px;
                width: 100%;
                min-width: 0;
                color: #35577f
            }

            input::placeholder {
                color: #a4b5ca
            }

            #siteForm label:not(:first-of-type),#editSiteForm label:not(:first-of-type) {
                margin-top: 21px
            }

            .form-actions {
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 12px;
                margin-top: 24px;
                flex-wrap: wrap
            }

            .primary-button,.secondary-button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                font-size: 12px;
                border-radius: 9px;
                padding: 11px 18px;
                min-height: 40px
            }

            .primary-button {
                background: #3972c1;
                color: white;
                box-shadow: 0 4px 12px #3072ca14
            }

            .primary-button:hover {
                background: #2c60a7
            }

            .secondary-button {
                background: #e9f0fa;
                border: 1px solid #d8e4f4;
                color: #6d8bb4
            }

            .secondary-button:hover {
                background: #e0eafa
            }

            .list-heading {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 15px
            }

            .list-heading>span {
                font-family: var(--number);
                font-size: 11px;
                color: #93a8c3
            }

            .settings-site {
                display: flex;
                align-items: center;
                gap: 13px;
                border-bottom: 1px solid var(--line);
                padding: 17px 0
            }

            .mini-bubble {
                width: 44px;
                height: 44px;
                display: grid;
                place-items: center;
                border-radius: 50%;
                background: var(--bubble,#cdddF3);
                color: #647fa4;
                flex: none
            }

            .mini-bubble svg {
                width: 21px;
                height: 21px
            }

            .site-info {
                flex: 1;
                min-width: 0
            }

            .site-name {
                display: block;
                font-size: 13px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap
            }

            .site-url {
                display: block;
                font: 10px var(--number);
                color: #93a6bf;
                margin-top: 5px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap
            }

            .site-visits {
                font-size: 10px;
                color: #99acc3;
                white-space: nowrap
            }

            .settings-site .round-button {
                width: 34px;
                height: 34px;
                border: 0;
                background: #e5edf9;
                color: #7094c3;
                backdrop-filter: none
            }

            .settings-site .round-button svg {
                width: 15px;
                height: 15px
            }

            .settings-site [data-delete-site] {
                background: #fae9ed;
                color: #bd6d7f
            }

            .panel-title {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 20px;
                margin-bottom: 24px
            }

            .panel-title>span {
                font-size: 11px;
                color: #8da1bb
            }

            .empty {
                display: grid;
                place-items: center;
                text-align: center;
                color: #91a6c2;
                font-size: 14px;
                line-height: 1.8;
                padding: 32px;
                min-height: 240px;
                grid-column: 1/-1
            }

            .empty.full {
                min-height: calc(100dvh - 260px);
                width: 100%;
                border: 1px dashed #d0dff0;
                border-radius: 17px;
                background: #ffffff45
            }

            #taskDeadlines {
                display: grid;
                grid-template-columns: repeat(auto-fit,minmax(min(360px,100%),1fr));
                gap: 18px;
                width: 100%
            }

            .deadline-card {
                padding: 24px;
                border: 1px solid #d7e2f1;
                border-radius: 16px;
                background: #fff9;
                display: flex;
                flex-direction: column;
                gap: 17px;
                min-height: 180px
            }

            .deadline-card h3 {
                font-size: 15px;
                line-height: 1.7;
                overflow-wrap: anywhere
            }

            .deadline-card p {
                font-size: 12px;
                color: #859fbd
            }

            .deadline-card .secondary-button {
                align-self: flex-start;
                margin-top: auto
            }

            #deadlineTaskName {
                font-size: 14px;
                line-height: 1.8;
                margin-bottom: 24px;
                overflow-wrap: anywhere
            }

            .appearance-layout {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 26px;
                width: 100%
            }

            .appearance-column {
                display: flex;
                flex-direction: column;
                gap: 19px;
                min-width: 0
            }

            .control-card {
                background: #ffffffa6;
                border: 1px solid #d9e4f1;
                border-radius: 16px;
                padding: 23px
            }

            .control-card h2 {
                font-size: 16px;
                margin-bottom: 21px
            }

            .theme-presets {
                display: grid;
                grid-template-columns: repeat(3,minmax(0,1fr));
                gap: 11px
            }

            .theme-preset {
                padding: 8px;
                border: 1px solid #dde6f2;
                border-radius: 11px;
                background: #f7faff;
                font-size: 11px;
                color: #8198b6
            }

            .theme-preset.active {
                border-color: #729ddc;
                box-shadow: 0 0 0 2px #779fda15;
                color: #3e70af
            }

            .theme-preset>span {
                display: block;
                height: 43px;
                border-radius: 6px;
                margin-bottom: 8px
            }

            .color-controls {
                display: grid;
                grid-template-columns: repeat(3,minmax(0,1fr));
                gap: 16px
            }

            .color-control {
                margin: 0;
                font-size: 11px
            }

            .color-control input[type=color] {
                width: 100%;
                height: 42px;
                margin-top: 8px;
                padding: 3px;
                border: 1px solid #d8e4f3;
                border-radius: 8px;
                background: white;
                cursor: pointer
            }

            .preview-card {
                position: relative;
                overflow: hidden;
                border: 1px solid #b5d3f55c;
                border-radius: 16px;
                aspect-ratio: 16/8.3;
                background: #07142b;
                flex: none
            }

            .preview-card canvas {
                width: 100%;
                height: 100%;
                display: block
            }

            .preview-card>span {
                position: absolute;
                bottom: 12px;
                left: 15px;
                font-size: 10px;
                letter-spacing: .06em;
                color: #c4d9efb3;
                pointer-events: none
            }

            .effect-controls {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 23px 27px
            }

            .range-label {
                display: flex;
                align-items: center;
                justify-content: space-between;
                font-size: 12px;
                margin-bottom: 12px
            }

            .range-label output {
                font: 11px var(--number);
                color: #91a7c5
            }

            input[type=range] {
                width: 100%;
                height: 5px;
                appearance: none;
                background: #dce7f5;
                border-radius: 20px;
                cursor: pointer;
                accent-color: #6595d9
            }

            input[type=range]::-webkit-slider-thumb {
                appearance: none;
                width: 15px;
                height: 15px;
                background: #6494d5;
                border: 3px solid #eef4ff;
                border-radius: 50%;
                box-shadow: 0 1px 5px #6192d146
            }

            .setting-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 20px;
                padding: 15px 0;
                border-top: 1px solid var(--line)
            }

            .setting-row:first-child {
                border: 0;
                padding-top: 0
            }

            .setting-row:last-child {
                padding-bottom: 0
            }

            .setting-row label {
                font-size: 12px;
                margin: 0;
                line-height: 1.8
            }

            .setting-row select {
                width: 112px;
                padding: 9px
            }

            .switch {
                appearance: none;
                width: 39px;
                height: 23px;
                border-radius: 20px;
                background: #cedcee;
                position: relative;
                cursor: pointer;
                flex: none
            }

            .switch:after {
                content: '';
                width: 17px;
                height: 17px;
                position: absolute;
                top: 3px;
                left: 3px;
                background: white;
                border-radius: 50%;
                box-shadow: 0 1px 3px #132a4a15;
                transition: transform .2s
            }

            .switch:checked {
                background: #6694d1
            }

            .switch:checked:after {
                transform: translateX(16px)
            }

            .appearance-actions {
                display: flex;
                justify-content: flex-end;
                gap: 13px;
                margin-top: auto;
                padding-top: 2px
            }

            #panelData {
                display: flex;
                flex-direction: column
            }

            .source-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: repeat(2,minmax(200px,1fr));
                gap: 22px;
                flex: 1;
                min-height: 0
            }

            .source-card {
                border: 1px solid #d6e3f3;
                border-radius: 18px;
                background: #fff9;
                padding: 28px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                min-height: 200px
            }

            .source-card-head {
                display: flex;
                align-items: center;
                gap: 13px;
                font-size: 17px;
                font-weight: 600
            }

            .source-card-head>span {
                display: grid;
                place-items: center;
                width: 40px;
                height: 40px;
                border-radius: 12px;
                background: #eaf2fd;
                color: #6d94c6
            }

            .source-card-head svg {
                width: 22px;
                height: 22px
            }

            .source-state {
                display: flex;
                align-items: center;
                gap: 9px;
                font-size: 14px;
                color: #789b86;
                margin-top: 30px
            }

            .status-dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: #7ea98d;
                flex: none
            }

            .error .status-dot {
                background: #d77783
            }

            .pending .status-dot {
                background: #a3aed0
            }

            .source-card.error .source-state {
                color: #bd6d7f
            }

            .source-card time {
                font-size: 12px;
                color: #a0b0c4;
                margin-top: 15px
            }

            .source-card small {
                font-size: 11px;
                color: #a1b1c8;
                margin-top: 10px;
                line-height: 1.7
            }

            .all-body {
                display: flex;
                flex-direction: column;
                flex: 1;
                min-height: 0;
                padding: 27px 32px
            }

            .all-toolbar {
                display: flex;
                align-items: center;
                gap: 25px;
                flex: none
            }

            .search {
                display: flex;
                align-items: center;
                gap: 12px;
                border: 1px solid #d4e0ef;
                border-radius: 10px;
                padding-left: 13px;
                margin: 0;
                flex: 1
            }

            .search svg {
                width: 17px;
                height: 17px;
                color: #96adcc
            }

            .search input {
                border: 0!important;
                background: transparent!important
            }

            #allSitesGrid {
                display: grid;
                grid-template-columns: repeat(auto-fit,minmax(205px,1fr));
                align-content: start;
                gap: 18px;
                margin: 27px 0 0;
                flex: 1

            .all-site {
                padding: 25px 18px;
                display: flex;
                align-items: center;
                flex-direction: column;
                gap: 14px;
                background: #ffffff9c;
                border: 1px solid #d6e3f3;
                border-radius: 17px;
                min-width: 0
            }

            .all-site:hover {
                background: white;
                border-color: #b8cfee
            }

            .all-site .mini-bubble {
                width: 66px;
                height: 66px
            }

            .all-site .mini-bubble svg {
                width: 29px;
                height: 29px
            }

            .all-site .site-name,.all-site .site-url {
                max-width: 100%;
                margin: 0
            }

            .detail-row {
                padding: 18px 0;
                border-bottom: 1px solid var(--line)
            }

            .detail-row:first-child {
                padding-top: 0
            }

            .detail-row strong {
                font-size: 15px;
                font-weight: 600;
                line-height: 1.7;
                overflow-wrap: anywhere
            }

            .detail-row p {
                font-size: 12px;
                color: #849ab7;
                line-height: 1.9;
                margin-top: 8px;
                white-space: pre-line
            }

            .detail-row .overdue {
                color: #bd6e7e
            }

            .detail-actions {
                display: flex;
                gap: 12px;
                align-items: center;
                flex-wrap: wrap;
                margin-top: 25px
            }

            .finance-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px
            }

            .finance-box {
                background: #eaf1fb;
                border-radius: 14px;
                padding: 22px 16px
            }

            .finance-box>span {
                display: block;
                font-size: 11px;
                color: #859ebd;
                margin-bottom: 14px
            }

            .finance-box strong {
                font: 500 27px var(--number);
                white-space: nowrap
            }

            .confirm-dialog {
                width: min(440px,calc(100vw - 36px));
                padding: 30px;
                text-align: center;
                align-items: center;
                overflow: auto
            }

            .confirm-symbol {
                width: 50px;
                height: 50px;
                border-radius: 15px;
                background: #e4edfc;
                color: #759ad2;
                display: grid;
                place-items: center;
                margin-bottom: 22px
            }

            .confirm-symbol svg {
                width: 24px;
                height: 24px
            }

            .confirm-dialog h2 {
                font-size: 20px;
                line-height: 1.6
            }

            .confirm-dialog p {
                font-size: 13px;
                line-height: 1.9;
                color: #849ab7;
                margin: 14px 0 27px;
                overflow-wrap: anywhere;
                white-space: pre-line
            }

            .confirm-actions {
                display: flex;
                justify-content: center;
                gap: 13px;
                flex-wrap: wrap
            }

            .confirm-dialog.destructive .confirm-symbol {
                background: #fae5eb;
                color: #c47d90
            }

            .confirm-dialog.destructive #confirmAccept {
                background: #bf657e
            }

            .notifications {
                position: fixed;
                inset: auto 18px calc(var(--ticker-height) + 18px) auto;
                margin: 0;
                padding: 0;
                border: 0;
                background: transparent;
                max-width: min(440px,calc(100vw - 36px));
                width: max-content;
                pointer-events: none;
                overflow: visible
            }

            .notifications:popover-open,.notifications.legacy-visible {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                gap: 10px
            }

            .notification {
                display: flex;
                align-items: flex-start;
                gap: 12px;
                padding: 16px 19px;
                border-radius: 13px;
                border: 1px solid #b4d3f4;
                background: #e0efff;
                color: #35658f;
                box-shadow: 0 10px 35px #0003;
                font-size: 13px;
                line-height: 1.8;
                animation: notice-up .4s cubic-bezier(.2,.8,.2,1) both;
                overflow-wrap: anywhere;
                max-width: 100%
            }

            .notification>span:first-child {
                flex: none;
                margin-top: 3px;
                color: #6799ca
            }

            .notification svg {
                width: 18px;
                height: 18px
            }

            .notification.error {
                background: #ffe4eb;
                border-color: #f0b9c8;
                color: #ac3d59
            }

            .notification.error>span:first-child {
                color: #cd718c
            }

            .notification.success {
                background: #e0f6eb;
                border-color: #b2dfc9;
                color: #397a5c
            }

            .notification.success>span:first-child {
                color: #6cae8b
            }

            .notification.warning {
                background: #fff0dd;
                border-color: #efd3ad;
                color: #a97736
            }

            .notification.warning>span:first-child {
                color: #c69d60
            }

            .notification.leaving {
                animation: notice-away .25s ease-in both
            }

            @keyframes spin {
                to {
                    rotate: 360deg
                }
            }

            @keyframes clock-hit {
                0% {
                    box-shadow: 0 0 0 0 #7ecfff00
                }

                30% {
                    box-shadow: 0 0 0 11px #7ecfff16,0 0 42px #5fbbff1c
                }

                100% {
                    box-shadow: 0 0 0 25px #7ecfff00
                }
            }

            @keyframes dialog-in {
                from {
                    opacity: 0;
                    transform: translateY(12px)
                }

                to {
                    opacity: 1;
                    transform: none
                }
            }

            @keyframes notice-up {
                from {
                    opacity: 0;
                    transform: translateY(calc(100% + var(--ticker-height) + 25px))
                }

                to {
                    opacity: 1;
                    transform: translateY(0)
                }
            }

            @keyframes notice-away {
                to {
                    opacity: 0;
                    transform: translateY(-14px)
                }
            }

    <body>
        <div class="background" aria-hidden="true">
            <canvas id="waveCanvas"></canvas>
        </div>
        <button class="brand" id="brandRefresh" aria-label="Daten aktualisieren" title="Daten aktualisieren" type="button">
            <span data-icon="logo"></span>
            <b>
                shogi<span>space</span>.
            </b>
        </button>
        <div class="all-reveal" id="allReveal">
            <button class="all-button round-button" id="allSitesButton" aria-label="Alle Internetseiten" title="Alle Internetseiten" data-icon="grid"></button>
        </div>
        <main id="main">
            <section class="clocks" aria-label="Uhrzeiten">
                <div class="clock-block" aria-label="Deutschland">
                    <div class="clock-row">
                        <span class="flag" data-icon="flag-germany" aria-hidden="true"></span>
                        <time id="berlinTime">--:--</time>
                    </div>
                    <p class="clock-date" id="berlinDate"></p>
                </div>
                <div class="clock-block" aria-label="Georgien">
                    <div class="clock-row">
                        <span class="flag" data-icon="flag-georgia" aria-hidden="true"></span>
                        <time id="tbilisiTime">--:--</time>
                    </div>
                    <p class="clock-date" id="tbilisiDate"></p>
                </div>
            </section>
            <div id="siteBubbles" aria-label="Internetseiten"></div>
        </main>
        <section class="ticker" aria-label="Informationen">
            <div class="ticker-window">
                <div id="tickerTrack"></div>
            </div>
        </section>
        <div class="settings-reveal" id="settingsReveal">
            <button class="round-button" id="settingsButton" aria-label="Einstellungen" title="Einstellungen" data-icon="settings"></button>
        </div>
        <dialog id="settingsDialog" class="settings-dialog full-dialog" aria-labelledby="settingsTitle">
            <div class="dialog-header">
                <h1 id="settingsTitle">Einstellungen</h1>
                <button class="round-button" data-close="settingsDialog" aria-label="Schließen" data-icon="x"></button>
            </div>
            <div class="tabs" role="tablist" aria-label="Einstellungen">
                <button role="tab" id="tabSites" aria-controls="panelSites" aria-selected="true" data-tab="Sites">Internetseiten</button>
                <button role="tab" id="tabDates" aria-controls="panelDates" aria-selected="false" tabindex="-1" data-tab="Dates">Aufgaben</button>
                <button role="tab" id="tabView" aria-controls="panelView" aria-selected="false" tabindex="-1" data-tab="View">Gestaltung</button>
                <button role="tab" id="tabData" aria-controls="panelData" aria-selected="false" tabindex="-1" data-tab="Data">Datenquellen</button>
            </div>
            <div class="settings-body">
                <section id="panelSites" role="tabpanel" aria-labelledby="tabSites">
                    <div class="site-management">
                        <form id="siteForm" novalidate>
                            <h2>Internetseite hinzufügen</h2>
                            <label for="siteName">Name</label>
                            <input id="siteName" maxlength="80" required autocomplete="off">
                            <label for="siteUrl">Internetadresse</label>
                            <input type="url" id="siteUrl" maxlength="2000" required placeholder="https://example.com" autocomplete="off">
                            <button type="submit" class="primary-button">Hinzufügen</button>
                        </form>
                        <div class="site-list-panel">
                            <div class="list-heading">
                                <h2>Meine Internetseiten</h2>
                                <span id="siteCount"></span>
                            </div>
                            <div id="settingsSites"></div>
                        </div>
                    </div>
                </section>
                <section id="panelDates" role="tabpanel" aria-labelledby="tabDates" hidden>
                    <div class="panel-title">
                        <h2>Aufgaben und Fristen</h2>
                        <span>Fristen werden in diesem Browser gespeichert.</span>
                    </div>
                    <div id="taskDeadlines"></div>
                </section>
                <section id="panelView" role="tabpanel" aria-labelledby="tabView" hidden>
                    <div class="appearance-layout">
                        <div class="appearance-column">
                            <div class="control-card">
                                <h2>Farbwelten</h2>
                                <div id="themePresets" class="theme-presets"></div>
                            </div>
                            <div class="control-card">
                                <h2>Eigene Farben</h2>
                                <div id="colorControls" class="color-controls"></div>
                            </div>
                            <div class="control-card">
                                <div class="setting-row">
                                    <label for="visibleCount">Sichtbare Internetseiten</label>
                                    <select id="visibleCount"></select>
                                </div>
                                <div class="setting-row">
                                    <label for="motionToggle">Hintergrund und Blasen bewegen</label>
                                    <input type="checkbox" class="switch" id="motionToggle">
                                </div>
                                <div class="setting-row">
                                    <label for="horizonSelect">Zeitraum für kommende Termine</label>
                                    <select id="horizonSelect">
                                        <option value="7">7 Tage</option>
                                        <option value="14">14 Tage</option>
                                        <option value="30">30 Tage</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="appearance-column">
                            <div class="preview-card">
                                <canvas id="appearancePreview" aria-label="Hintergrundvorschau"></canvas>
                                <span>Vorschau</span>
                            </div>

                        const key = event.target.dataset.effect;
                        draft[key] = Number(event.target.value);
                        const unit = effectFields.find(f => f[0] === key)[4];
                        $('effectValue-' + key).textContent = draft[key] + unit;
                        updateAppearanceButtons();
                        applyAppearance(draft);
                    }
                }
                );
                $('saveAppearance').addEventListener('click', async () => {
                    if (!draftDirty)
                        return;
                    if (!await confirmAction('Hintergrund speichern?', 'Möchten Sie diese Farben und Welleneinstellungen dauerhaft übernehmen?', false, 'Übernehmen'))
                        return;
                    settings.appearance = V.normalize(draft);
                    draft = clone(settings.appearance);
                    save();
                    updateAppearanceButtons();
                    applyAppearance(settings.appearance);
                    notify('Der Hintergrund wurde gespeichert.', 'success');
                }
                );
                $('discardAppearance').addEventListener('click', async () => {
                    if (!draftDirty || !await confirmAction('Änderungen verwerfen?', 'Möchten Sie die ungespeicherten Änderungen am Hintergrund wirklich verwerfen?', false, 'Verwerfen'))
                        return;
                    draft = clone(settings.appearance);
                    renderAppearance();
                    applyAppearance(settings.appearance);
                    notify('Die Hintergrundänderungen wurden verworfen.');
                }
                );
                document.querySelectorAll('dialog').forEach(dialog => {
                    dialog.addEventListener('click', event => {
                        if (event.target !== dialog)
                            return;
                        const r = dialog.getBoundingClientRect();
                        if (event.clientX < r.left || event.clientX > r.right || event.clientY < r.top || event.clientY > r.bottom)
                            closeDialog(dialog.id);
                    }
                    );
                    dialog.addEventListener('cancel', event => {
                        if (dialog.id === 'settingsDialog' && draftDirty) {
                            event.preventDefault();
                            closeDialog(dialog.id);
                        }
                    }
                    );
                    dialog.addEventListener('close', () => {
                        if (dialog.id === 'detailDialog')
                            activeDetail = null;
                        if (dialog.id === 'settingsDialog') {
                            draft = clone(settings.appearance);
                            draftDirty = false;
                            applyAppearance(settings.appearance);
                        }
                    }
                    );
                }
                );
                document.querySelector('.tabs').addEventListener('keydown', event => {
                    const tabs = [...document.querySelectorAll('[data-tab]')]
                      , i = tabs.indexOf(document.activeElement);
                    let n = i;
                    if (event.key === 'ArrowRight')
                        n = (i + 1) % tabs.length;
                    else if (event.key === 'ArrowLeft')
                        n = (i + tabs.length - 1) % tabs.length;
                    else if (event.key === 'Home')
                        n = 0;
                    else if (event.key === 'End')
                        n = tabs.length - 1;
                    else
                        return;
                    event.preventDefault();
                    selectTab(tabs[n].dataset.tab);
                    tabs[n].focus();
                }
                );
                let controlTimer;
                function revealControls() {
                    clearTimeout(controlTimer);
                    for (const id of ['allReveal', 'settingsReveal'])
                        $(id).classList.add('visible');
                    controlTimer = setTimeout( () => {
                        for (const id of ['allReveal', 'settingsReveal'])
                            if (!$(id).matches(':hover') && !$(id).querySelector(':focus-visible'))
                                $(id).classList.remove('visible');
                    }
                    , 3000);
                }
                document.addEventListener('pointermove', revealControls, {
                    passive: true
                });
                document.addEventListener('pointerdown', revealControls, {
                    passive: true
                });
                for (const id of ['allReveal', 'settingsReveal']) {
                    $(id).addEventListener('pointerleave', revealControls);
                    $(id).addEventListener('focusout', revealControls);
                }
                mediaMotion.addEventListener('change', applyPreferences);
                window.addEventListener('online', () => refresh());
                window.addEventListener('offline', () => refresh());
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) {
                        updateClocks();
                        if (Date.now() - Math.min(...Object.values(sources).map(s => s.updated ? +s.updated : 0)) > 60000)
                            refresh();
                    }
                }
                );
                window.addEventListener('storage', event => {
                    if (event.key === STORE)
                        try {
                            settings = normalize(JSON.parse(event.newValue));
                            draft = clone(settings.appearance);
                            draftDirty = false;
                            applyPreferences();
                            renderBubbles();
                            renderSites();
                            renderDeadlines();
                            updateTicker();
                            if ($('settingsDialog').open && !$('panelView').hidden)
                                renderAppearance();
                        } catch {}
                }
                );
                applyPreferences();
                renderBubbles();
                renderSites();
                renderSources();
                renderDeadlines();
                updateClocks();
                revealControls();
                sizeCanvas($('waveCanvas'));
                const resize = new ResizeObserver( () => {
                    resetMotion();
                    sizeCanvas($('waveCanvas'));
                    if (!$('panelView').hidden)
                        sizeCanvas($('appearancePreview'));
                }
                );
                resize.observe($('main'));
                resize.observe(document.querySelector('.clocks'));
                const previewResize = new ResizeObserver( () => sizeCanvas($('appearancePreview')));
                previewResize.observe($('appearancePreview'));
                document.fonts.ready.then( () => {
                    resetMotion();
                    fitLabels();
                }
                );
                requestAnimationFrame(animate);
                refresh();
                setInterval(updateClocks, 1000);
                setInterval( () => {
                    if (!document.hidden)
                        refresh();
                }
                , 60000);
            }
            )();
        </script>
    </body>
</html>
